name: Trading bot

# Runs the paper trading loop every 5 minutes on weekdays. The server checks the market clock,
# so runs outside regular hours only refresh data. GitHub may delay scheduled runs a few minutes.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run one bot pass
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET missing"; exit 0; fi
          curl -fsS --max-time 180 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick"
